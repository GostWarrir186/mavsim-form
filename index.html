<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление доставки Mavsimi Rason</title>
    
    <!-- Подключаем Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Подключаем бесплатные карты Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #999999;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
            color: #000;
        }

        .map-section {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #ddd;
        }

        .map-hint {
            font-size: 12px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 8px;
        }

        /* Контейнер интерактивной карты */
        #map {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .main-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .main-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h2>Оформление доставки</h2>

    <div class="form-group">
        <label for="city_pickup">Город забора (Откуда):</label>
        <input type="text" id="city_pickup" value="Душанбе">
    </div>

    <div class="form-group">
        <label for="address_pickup">Точный адрес забора:</label>
        <input type="text" id="address_pickup" placeholder="ул. Рудаки, дом 10">
    </div>

    <div class="form-group">
        <label for="city_delivery">Город доставки (Куда):</label>
        <input type="text" id="city_delivery" placeholder="Введите город">
    </div>

    <div class="form-group">
        <label for="address_delivery">Точный адрес доставки:</label>
        <input type="text" id="address_delivery" placeholder="Куда везти товар">
    </div>

    <div class="form-group">
        <label for="driver_comment">Ориентир для курьера:</label>
        <input type="text" id="driver_comment" placeholder="Например: возле ТЦ Садбарг">
    </div>

    <div class="form-group">
        <label for="delivery_type">Тип доставки:</label>
        <select id="delivery_type">
            <option value="door">До двери 🚪</option>
            <option value="pvz">До ПВЗ 🏢</option>
        </select>
    </div>

    <div class="form-group">
        <label for="weight">Вес посылки (кг):</label>
        <input type="number" id="weight" value="1">
    </div>

    <div class="form-group">
        <label for="sizes">Габариты (ДхШхВ):</label>
        <input type="text" id="sizes" value="10x10x10">
    </div>

    <div class="form-group">
        <label for="price">Итоговая стоимость (TJS):</label>
        <input type="number" id="price" value="20.80">
    </div>

    <!-- БЛОК ДОБРОВОЛЬНОГО ВЫБОРА ГЕОПОЗИЦИИ -->
    <div class="map-section">
        <label>📍 Точное местоположение для курьера</label>
        <div class="map-hint">Перетащите маркер пальцем или кликните в нужное место на карте, чтобы курьер вас быстро нашёл.</div>
        
        <div id="map"></div>
        
        <!-- Скрытое поле, куда пишется результат "Широта,Долгота" -->
        <input type="hidden" id="coords" value="">
    </div>

    <button class="main-btn" onclick="sendOrderData()">Подтвердить и отправить заказ</button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем окно на максимум

        // Получаем имя и телефон из адресной строки (переданные из бота)
        const urlParams = new URLSearchParams(window.location.search);
        const senderName = urlParams.get('fio') || 'Не указано';
        const senderPhone = urlParams.get('phone') || 'Не указано';

        // 1. Инициализируем интерактивную карту (по умолчанию ставим центр на Душанбе)
        let startLat = 38.56, startLon = 68.78;
        let map = L.map('map').setView([startLat, startLon], 13);

        // 2. Рендерим бесплатную подложку карт OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Создаем маркер, который пользователь может двигать пальцем (draggable: true)
        let marker = L.marker([startLat, startLon], { draggable: true }).addTo(map);

        // Функция обновления скрытого поля с координатами
        function setCoords(lat, lon) {
            document.getElementById('coords').value = lat.toFixed(6) + "," + lon.toFixed(6);
        }
        
        // Ставим дефолтное значение
        setCoords(startLat, startLon);

        // Клик по карте — перемещает маркер в точку клика
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            setCoords(e.latlng.lat, e.latlng.lng);
        });

        // Перетаскивание маркера пальцем — обновляет координаты при остановке
        marker.on('dragend', function(e) {
            let position = marker.getLatLng();
            setCoords(position.lat, position.lng);
        });

        // Доброжелательный GPS-запрос: если юзер разрешит, карта сама прыгнет к нему
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                let gpsLat = position.coords.latitude;
                let gpsLon = position.coords.longitude;
                map.setView([gpsLat, gpsLon], 16);
                marker.setLatLng([gpsLat, gpsLon]);
                setCoords(gpsLat, gpsLon);
            }, function(error) {
                console.log("Геолокация отклонена или недоступна, используется дефолтный центр.");
            });
        }

        // Генерация случайного ID заказа (ORD-XXXX-XXXX)
        function generateId() {
            const r = () => Math.floor((1 + Math.random()) * 0x10000).toString(16).substring(1).toUpperCase();
            return `ORD-${r()}-${r()}`;
        }

        // Функция сборки данных и отправки в Telegram
        function sendOrderData() {
            const orderData = {
                order_id: generateId(),
                lang: "ru",
                s_name: senderName,
                s_phone: senderPhone,
                city_pickup: document.getElementById('city_pickup').value,
                address_pickup: document.getElementById('address_pickup').value,
                city_delivery: document.getElementById('city_delivery').value,
                address_delivery: document.getElementById('address_delivery').value,
                driver_comment: document.getElementById('driver_comment').value,
                delivery_type: document.getElementById('delivery_type').value,
                weight: document.getElementById('weight').value,
                sizes: document.getElementById('sizes').value,
                price: document.getElementById('price').value,
                r_name: "Получатель", // Заглушка, если нет поля
                r_phone: "Не указан",  // Заглушка, если нет поля
                coords: document.getElementById('coords').value // Передаем точку с карты!
            };

            // Отправляем JSON-строку обратно в Python-бот
            tg.sendData(JSON.stringify(orderData));
        }
    </script>
</body>
</html>
