<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Панель управления</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="theme.css?v=2">
<script>
// Тема: явный выбор Telegram важнее системной; палитра — в theme.css
(function () {
    var d = document.documentElement, s = null;
    try { s = Telegram.WebApp.colorScheme; } catch (e) {}
    if (!s) s = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    d.setAttribute('data-theme', s);
    try { Telegram.WebApp.onEvent('themeChanged', function () {
        d.setAttribute('data-theme', Telegram.WebApp.colorScheme || 'light');
    }); } catch (e) {}
})();
</script>
<style>
    .pane { display: none; padding-top: 14px; }
    .pane.on { display: block; }

    .oc { border-left: 3px solid var(--border-strong); }
    .oc-TAKEN      { border-left-color: var(--s-taken); }
    .oc-IN_TRANSIT { border-left-color: var(--s-transit); }
    .oc-DELIVERED  { border-left-color: var(--s-delivered); }
    .oc-NEW        { border-left-color: var(--s-new); }
    .oc-READY      { border-left-color: var(--s-ready); }

    .oc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .oc-id { font-size: 12.5px; font-weight: 650; letter-spacing: .01em; }
    .oc-top .badge { margin-left: auto; }
    .oc-route { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; min-width: 0; }
    .oc-route .c { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .oc-route .ic { color: var(--ink-3); flex: none; }
    .oc-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 9px; font-size: 12.5px; color: var(--ink-2); }
    .oc-meta span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .oc-meta .ic { color: var(--ink-3); }

    .week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .week-nav .lbl { flex: 1; text-align: center; font-size: 13.5px; font-weight: 650; }

    /* ── шторка управления ── */
    .sheet-bg {
        position: fixed; inset: 0; z-index: 60; display: none;
        background: rgba(10, 13, 18, .5); backdrop-filter: blur(2px);
        align-items: flex-end; justify-content: center;
    }
    .sheet-bg.on { display: flex; }
    .sheet {
        width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
        background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0;
        padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
        box-shadow: var(--shadow-lg); animation: sheet-up .26s cubic-bezier(.2,.7,.2,1);
    }
    @keyframes sheet-up { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
    .sheet-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
    .sheet-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
    .sheet-head .sub { font-size: 12.5px; color: var(--ink-3); }
    .sheet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .sheet-cour {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 11px 12px; margin-top: 7px; min-height: var(--tap);
        background: var(--surface-2); border: 1px solid transparent;
        border-radius: var(--r); cursor: pointer; font: inherit; text-align: left; color: var(--ink);
    }
    .sheet-cour:active { border-color: var(--accent); }
    .danger-zone { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 16px; }
</style>
</head>
<body>

 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol><symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1. <div id="app"></div>

<div class="sheet-bg" id="sheetBg">
    <div class="sheet" id="sheet"></div>
</div>

<script>
    var tg = (window.Telegram && window.Telegram.WebApp)
        ? window.Telegram.WebApp
        : { ready: function () {}, expand: function () {}, sendData: function () {} };
    tg.ready(); tg.expand();

    var DATA = null;
    try {
        var raw = new URLSearchParams(window.location.search).get('d');
        if (raw) {
            var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
            var pad = '='.repeat((4 - b64.length % 4) % 4);
            var bytes = Uint8Array.from(atob(b64 + pad), function (c) { return c.charCodeAt(0); });
            DATA = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        }
    } catch (e) { console.error(e); }

    var app = document.getElementById('app');
    var sheetBg = document.getElementById('sheetBg');
    var sheet = document.getElementById('sheet');
    var activeTab = 0;
    var weekOffset = 0;
    var manageOrder = null;

    function esc(s) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(String(s == null ? '' : s)));
        return d.innerHTML;
    }
    function icon(n, cls) { return '<svg class="ic ' + (cls || '') + '"><use href="#i-' + n + '"></use></svg>'; }

    var STATUS_LABEL = { TAKEN: 'Принял', IN_TRANSIT: 'В пути', DELIVERED: 'Доставил' };
    var STATUS_TONE = { TAKEN: 'badge badge-info', IN_TRANSIT: 'badge badge-violet', DELIVERED: 'badge badge-ok' };
    var STATUSES = [
        { key: 'TAKEN',      label: 'Принял' },
        { key: 'IN_TRANSIT', label: 'В пути' },
        { key: 'DELIVERED',  label: 'Доставил' }
    ];
    var STATUS_ORDER = STATUSES.map(function (s) { return s.key; });
    var CANCEL_REASONS = ['Курьер не приехал за посылкой', 'Получатель недоступен', 'Форс-мажор'];
    var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня',
                      'июля','августа','сентября','октября','ноября','декабря'];

    // ─── неделя ───
    function weekDates(offset) {
        var now = new Date(), dow = now.getDay();
        var mon = new Date(now);
        mon.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
        mon.setHours(0, 0, 0, 0);
        var sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        return { start: mon, end: sun };
    }
    function fmtDate(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
               '-' + String(d.getDate()).padStart(2, '0');
    }
    function weekLabel(s, e) {
        return s.getMonth() === e.getMonth()
            ? s.getDate() + '–' + e.getDate() + ' ' + MONTHS_GEN[s.getMonth()] + ' ' + s.getFullYear()
            : s.getDate() + ' ' + MONTHS_GEN[s.getMonth()] + ' – ' + e.getDate() + ' ' + MONTHS_GEN[e.getMonth()] + ' ' + e.getFullYear();
    }

    // ─── шторка управления заказом ───
    function openManage(idx) {
        manageOrder = (DATA.orders || [])[idx];
        if (!manageOrder) return;
        var o = manageOrder;
        var curIdx = STATUS_ORDER.indexOf(o.status);

        var pills = STATUSES.map(function (s, i) {
            var disabled = (s.key === o.status || i < curIdx);
            return '<button class="btn ' + (s.key === o.status ? 'btn-primary' : 'btn-outline') + ' btn-sm"' +
                (disabled ? ' disabled' : ' data-status="' + s.key + '"') + '>' + esc(s.label) + '</button>';
        }).join('');

        var couriers = (DATA.couriers || []).map(function (c) {
            return '<button class="sheet-cour" data-tid="' + esc(c.tid) + '" data-name="' + esc(c.fio) + '">' +
                '<span class="avatar">' + esc(initials(c.fio)) + '</span>' +
                '<span class="spacer"><span class="truncate" style="display:block;font-weight:600">' + esc(c.fio) + '</span>' +
                '<span class="' + (c.busy ? 'badge badge-warn' : 'badge badge-ok') + '" style="margin-top:3px">' +
                '<i class="dot"></i>' + (c.busy ? 'Занят' : 'Свободен') + '</span></span>' +
                icon('chevron-right', 'ic-sm') + '</button>';
        }).join('') || '<div class="empty">' + icon('users') + '<div>Нет активных курьеров</div></div>';

        var cancels = CANCEL_REASONS.map(function (r) {
            return '<button class="btn btn-danger btn-block btn-sm" style="margin-top:7px" data-reason="' + esc(r) + '">' +
                esc(r) + '</button>';
        }).join('');

        sheet.innerHTML =
            '<div class="sheet-head">' +
                '<div class="spacer"><h2 class="mono">' + esc(o.id) + '</h2>' +
                '<div class="sub">' + esc(o.city_from) + ' → ' + esc(o.city_to) + ' · ' +
                    esc(STATUS_LABEL[o.status] || o.status) + '</div></div>' +
                '<button class="icon-btn" id="sheetClose">' + icon('x') + '</button>' +
            '</div>' +

            '<div class="section-label" style="margin-top:16px">Сменить статус</div>' +
            '<div class="sheet-grid" style="margin-top:8px">' + pills + '</div>' +

            '<div class="section-label" style="margin-top:20px">Переназначить курьера</div>' +
            couriers +

            '<div class="danger-zone">' +
                '<div class="section-label" style="color:var(--bad)">Отменить заказ</div>' +
                cancels +
                '<div id="customWrap" style="display:none;margin-top:9px">' +
                    '<input class="input" id="customReason" type="text" placeholder="Причина отмены">' +
                    '<button class="btn btn-danger btn-block" id="customGo" style="margin-top:8px">' +
                        'Подтвердить отмену</button>' +
                '</div>' +
                '<button class="btn btn-ghost btn-block btn-sm" id="customShow" style="margin-top:7px">' +
                    icon('edit', 'ic-sm') + 'Своя причина</button>' +
            '</div>';

        sheetBg.classList.add('on');
        wireSheet();
    }

    function closeSheet() { sheetBg.classList.remove('on'); manageOrder = null; }

    function wireSheet() {
        document.getElementById('sheetClose').addEventListener('click', closeSheet);
        sheet.querySelectorAll('[data-status]').forEach(function (b) {
            b.addEventListener('click', function () {
                if (!manageOrder) return;
                var key = b.dataset.status;
                var found = STATUSES.filter(function (s) { return s.key === key; })[0];
                send({
                    action: 'change_status',
                    order_id: manageOrder.id,
                    order_row: manageOrder.row,
                    courier_id: manageOrder.courier_id,
                    new_status: key,
                    new_status_label: found ? found.label : key
                });
            });
        });
        sheet.querySelectorAll('[data-tid]').forEach(function (b) {
            b.addEventListener('click', function () {
                if (!manageOrder) return;
                send({
                    action: 'reassign_confirm',
                    order_row: manageOrder.row,
                    order_id: manageOrder.id,
                    courier_tid: b.dataset.tid,
                    courier_name: b.dataset.name
                });
            });
        });
        sheet.querySelectorAll('[data-reason]').forEach(function (b) {
            b.addEventListener('click', function () { cancelActive(b.dataset.reason); });
        });
        document.getElementById('customShow').addEventListener('click', function () {
            document.getElementById('customWrap').style.display = '';
            document.getElementById('customReason').focus();
        });
        document.getElementById('customGo').addEventListener('click', function () {
            var r = (document.getElementById('customReason').value || '').trim();
            if (r) cancelActive(r);
        });
    }

    function cancelActive(reason) {
        if (!manageOrder) return;
        send({
            action: 'cancel_active',
            order_id: manageOrder.id,
            order_row: manageOrder.row,
            courier_id: manageOrder.courier_id,
            reason: reason
        });
    }

    function send(payload) { tg.sendData(JSON.stringify(payload)); }

    function initials(name) {
        return String(name || '?').trim().split(/\s+/).slice(0, 2)
            .map(function (w) { return w[0] || ''; }).join('').toUpperCase() || '?';
    }

    // ─── карточки ───
    function orderCard(o, idx) {
        return '<div class="card oc oc-' + esc(o.status) + '" style="margin-bottom:10px">' +
            '<div class="oc-top"><span class="oc-id mono">' + esc(o.id) + '</span>' +
                '<span class="' + (STATUS_TONE[o.status] || 'badge') + '"><i class="dot"></i>' +
                esc(STATUS_LABEL[o.status] || o.status) + '</span></div>' +
            '<div class="oc-route"><span class="c">' + esc(o.city_from) + '</span>' +
                icon('arrow-right', 'ic-sm') + '<span class="c">' + esc(o.city_to) + '</span></div>' +
            '<div class="oc-meta">' +
                '<span>' + icon('truck', 'ic-sm') + '<span class="truncate">' + esc(o.courier || '—') + '</span></span>' +
                '<span>' + icon('wallet', 'ic-sm') + '<span class="mono">' + esc(o.price) + ' TJS</span></span>' +
                '<span>' + icon('phone', 'ic-sm') + '<span class="mono">' + esc(o.r_phone) + '</span></span>' +
            '</div>' +
            '<button class="btn btn-outline btn-block btn-sm" style="margin-top:12px" data-manage="' + idx + '">' +
                icon('settings', 'ic-sm') + 'Управление</button></div>';
    }

    function newCard(o) {
        return '<div class="card oc oc-NEW" style="margin-bottom:10px">' +
            '<div class="oc-top"><span class="oc-id mono">' + esc(o.id) + '</span>' +
                '<span class="badge badge-warn"><i class="dot"></i>Новый</span></div>' +
            '<div class="oc-route"><span class="c">' + esc(o.city_from) + '</span>' +
                icon('arrow-right', 'ic-sm') + '<span class="c">' + esc(o.city_to) + '</span></div>' +
            '<div class="oc-meta">' +
                '<span>' + icon('user', 'ic-sm') + '<span class="truncate">' + esc(o.s_name || '—') + '</span></span>' +
                '<span>' + icon('wallet', 'ic-sm') + '<span class="mono">' + esc(o.price) + ' TJS</span></span>' +
            '</div>' +
            '<button class="btn btn-primary btn-block btn-sm" style="margin-top:12px" ' +
                'data-accept="' + esc(o.id) + '" data-row="' + esc(o.row) + '">' +
                icon('check', 'ic-sm') + 'Принять в доставку</button></div>';
    }

    function freeCard(o) {
        return '<div class="card oc oc-READY" style="margin-bottom:10px">' +
            '<div class="oc-top"><span class="oc-id mono">' + esc(o.id) + '</span>' +
                '<span class="badge badge-warn"><i class="dot"></i>На бирже</span></div>' +
            '<div class="oc-route"><span class="c">' + esc(o.city_from) + '</span>' +
                icon('arrow-right', 'ic-sm') + '<span class="c">' + esc(o.city_to) + '</span></div>' +
            '<div class="oc-meta">' +
                '<span>' + icon('user', 'ic-sm') + '<span class="truncate">' + esc(o.s_name || '—') + '</span></span>' +
                '<span>' + icon('wallet', 'ic-sm') + '<span class="mono">' + esc(o.price) + ' TJS</span></span>' +
            '</div></div>';
    }

    function courierRow(c, withReport) {
        return '<div class="list-row">' +
            '<span class="avatar' + (c.busy ? '' : ' avatar-accent') + '">' + esc(initials(c.fio)) + '</span>' +
            '<span class="body"><span class="name truncate" style="display:block">' + esc(c.fio) + '</span>' +
            '<span class="' + (c.busy ? 'badge badge-warn' : 'badge badge-ok') + '" style="margin-top:3px">' +
            '<i class="dot"></i>' + (c.busy ? 'Занят' : 'Свободен') + '</span></span>' +
            (withReport
                ? '<button class="btn btn-outline btn-sm" data-report="' + esc(c.tid) + '" data-name="' + esc(c.fio) + '">' +
                  icon('download', 'ic-sm') + 'Отчёт</button>'
                : '') +
            '</div>';
    }

    function empty(ic, text) {
        return '<div class="card"><div class="empty">' + icon(ic) + '<div>' + esc(text) + '</div></div></div>';
    }

    // ─── рендер ───
    function render() {
        var orders = DATA.orders || [], free = DATA.free || [], news = DATA.new || [];
        var couriers = DATA.couriers || [];
        var busy = couriers.filter(function (c) { return c.busy; }).length;
        var w = weekDates(weekOffset);

        var birzha = '';
        if (!news.length && !free.length) {
            birzha = empty('inbox', 'Нет заказов');
        } else {
            if (news.length) {
                birzha += '<div class="section-label" style="margin-bottom:8px">Ожидают подтверждения · ' + news.length + '</div>';
                birzha += news.map(newCard).join('');
            }
            if (free.length) {
                birzha += '<div class="section-label" style="margin:16px 0 8px">На бирже · ' + free.length + '</div>';
                birzha += free.map(freeCard).join('');
            }
        }

        app.innerHTML =
        '<header class="topbar"><div class="topbar-inner" style="display:block;padding-bottom:0">' +
            '<div class="row" style="padding-bottom:10px">' +
                '<span class="glyph"><svg class="ic"><use href="#i-sliders"></use></svg></span>' +
                '<div class="spacer"><h1>Панель управления</h1>' +
                '<div class="sub">Mavsimi Rason</div></div>' +
            '</div>' +
            '<nav class="tabs">' +
                '<button data-tab="0" aria-selected="true">В работе</button>' +
                '<button data-tab="1" aria-selected="false">Заказы</button>' +
                '<button data-tab="2" aria-selected="false">Курьеры</button>' +
                '<button data-tab="3" aria-selected="false">Отчёты</button>' +
            '</nav>' +
        '</div></header>' +

        '<main class="container">' +
            '<div class="stat-grid stat-grid-3" style="margin-top:14px">' +
                '<div class="stat"><div class="stat-label">' + icon('truck', 'ic-sm') + '<span>В работе</span></div>' +
                    '<div class="stat-value mono">' + orders.length + '</div></div>' +
                '<div class="stat"><div class="stat-label">' + icon('inbox', 'ic-sm') + '<span>Новых</span></div>' +
                    '<div class="stat-value mono" style="color:var(--accent)">' + news.length + '</div></div>' +
                '<div class="stat"><div class="stat-label">' + icon('users', 'ic-sm') + '<span>Курьеров</span></div>' +
                    '<div class="stat-value mono">' + busy + '<span class="stat-unit">/ ' + couriers.length + '</span></div></div>' +
            '</div>' +

            '<div class="pane on" data-pane="0">' +
                (orders.length
                    ? orders.map(orderCard).join('')
                    : empty('check', 'Нет активных заказов')) +
            '</div>' +

            '<div class="pane" data-pane="1">' + birzha + '</div>' +

            '<div class="pane" data-pane="2">' +
                (couriers.length
                    ? '<div class="card"><div class="list">' +
                      couriers.map(function (c) { return courierRow(c, false); }).join('') + '</div></div>'
                    : empty('users', 'Нет активных курьеров')) +
            '</div>' +

            '<div class="pane" data-pane="3"><div class="stack">' +
                '<section class="card">' +
                    '<div class="week-nav">' +
                        '<button class="icon-btn" id="wPrev">' + icon('chevron-left') + '</button>' +
                        '<span class="lbl" id="weekLbl">' + esc(weekLabel(w.start, w.end)) + '</span>' +
                        '<button class="icon-btn" id="wNext"' + (weekOffset >= 0 ? ' disabled' : '') + '>' +
                            icon('chevron-right') + '</button>' +
                    '</div>' +
                    '<button class="btn btn-primary btn-block" id="reportAll">' +
                        icon('chart') + 'Сводный отчёт на всех курьеров</button>' +
                '</section>' +
                (couriers.length
                    ? '<section class="card"><div class="card-head"><div class="card-title">Отчёт по курьеру</div></div>' +
                      '<div class="list">' + couriers.map(function (c) { return courierRow(c, true); }).join('') +
                      '</div></section>'
                    : empty('users', 'Нет активных курьеров')) +
            '</div></div>' +
        '</main>';

        wire();
    }

    function wire() {
        app.querySelectorAll('[data-tab]').forEach(function (b) {
            b.addEventListener('click', function () {
                activeTab = +b.dataset.tab;
                app.querySelectorAll('[data-tab]').forEach(function (x) {
                    x.setAttribute('aria-selected', String(+x.dataset.tab === activeTab));
                });
                app.querySelectorAll('[data-pane]').forEach(function (p) {
                    p.classList.toggle('on', +p.dataset.pane === activeTab);
                });
                window.scrollTo(0, 0);
            });
        });
        app.querySelectorAll('[data-manage]').forEach(function (b) {
            b.addEventListener('click', function () { openManage(+b.dataset.manage); });
        });
        app.querySelectorAll('[data-accept]').forEach(function (b) {
            b.addEventListener('click', function () {
                send({ action: 'set_ready', order_id: b.dataset.accept, order_row: +b.dataset.row });
            });
        });
        app.querySelectorAll('[data-report]').forEach(function (b) {
            b.addEventListener('click', function () {
                send({
                    action: 'manager_report',
                    courier_tid: b.dataset.report,
                    courier_name: b.dataset.name,
                    week_start: fmtDate(weekDates(weekOffset).start)
                });
            });
        });
        var reportAll = document.getElementById('reportAll');
        if (reportAll) reportAll.addEventListener('click', function () {
            send({ action: 'manager_report_all', week_start: fmtDate(weekDates(weekOffset).start) });
        });
        var changeWeek = function (delta) {
            var next = weekOffset + delta;
            if (next > 0) return;
            weekOffset = next;
            var w = weekDates(weekOffset);
            document.getElementById('weekLbl').textContent = weekLabel(w.start, w.end);
            document.getElementById('wNext').disabled = weekOffset >= 0;
        };
        var wPrev = document.getElementById('wPrev'), wNext = document.getElementById('wNext');
        if (wPrev) wPrev.addEventListener('click', function () { changeWeek(-1); });
        if (wNext) wNext.addEventListener('click', function () { changeWeek(1); });
    }

    sheetBg.addEventListener('click', function (e) { if (e.target === sheetBg) closeSheet(); });

    if (!DATA) {
        app.innerHTML = '<main class="container" style="padding-top:40px">' +
            empty('link', 'Нет данных. Откройте панель через бота.') + '</main>';
    } else {
        render();
    }
</script>
</body>
</html>
