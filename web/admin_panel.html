<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Панель управления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary:   #2481cc;
            --primary-g: linear-gradient(135deg, #2a8de0, #1a6db5);
            --success:   #2bca80;
            --warning:   #f59e0b;
            --danger:    #e53935;
            --purple:    #9c27b0;
            --teal:      #00897b;
            --bg:     var(--tg-theme-bg-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --text:   var(--tg-theme-text-color, #1c1c1e);
            --hint:   var(--tg-theme-hint-color, #8e8e93);
            --r: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--sec-bg); color: var(--text);
            padding-bottom: 32px; overflow-x: hidden;
        }

        /* Header */
        .header { background: var(--primary-g); padding: 14px 16px 16px; }
        .header-sub  { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.6); letter-spacing: .8px; text-transform: uppercase; margin-bottom: 2px; }
        .header-title{ font-size: 17px; font-weight: 700; color: #fff; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 12px 12px 4px; }
        .stat { background: var(--bg); border-radius: var(--r); padding: 11px 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
        .stat-val { font-size: 22px; font-weight: 800; line-height: 1; }
        .stat-val.blue   { color: var(--primary); }
        .stat-val.green  { color: var(--success); }
        .stat-val.orange { color: var(--warning); }
        .stat-lbl { font-size: 9px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .3px; margin-top: 3px; }

        /* Tabs */
        .tabs { display: flex; gap: 0; padding: 12px 12px 0; overflow-x: auto; }
        .tab {
            flex: 1; min-width: 0; padding: 9px 4px; text-align: center;
            font-size: 11px; font-weight: 600; color: var(--hint);
            border-bottom: 2px solid transparent; cursor: pointer;
            transition: all .15s; white-space: nowrap;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* Content */
        .pane { display: none; padding: 10px 12px; }
        .pane.active { display: block; }

        /* Order card */
        .order-card {
            background: var(--bg); border-radius: var(--r);
            margin-bottom: 8px; padding: 12px 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,.05);
            border-left: 3px solid var(--primary);
        }
        .order-card.s-TAKEN     { border-left-color: var(--purple); }
        .order-card.s-LOADING   { border-left-color: var(--warning); }
        .order-card.s-IN_TRANSIT{ border-left-color: var(--success); }
        .order-card.s-ARRIVED   { border-left-color: var(--teal); }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .order-id { font-size: 12px; font-weight: 700; color: var(--text); }
        .status-pill {
            font-size: 9.5px; font-weight: 700; padding: 3px 8px;
            border-radius: 20px; text-transform: uppercase; letter-spacing: .3px;
        }
        .sp-TAKEN     { background: #f3e5f5; color: #7b1fa2; }
        .sp-LOADING   { background: #fff8e1; color: #e65100; }
        .sp-IN_TRANSIT{ background: #e8f5e9; color: #2e7d32; }
        .sp-ARRIVED   { background: #e0f7fa; color: #006064; }

        .card-route { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .card-route .arr { color: var(--hint); margin: 0 4px; font-size: 11px; }
        .card-meta { font-size: 11px; color: var(--hint); margin-bottom: 8px; }

        .btn-reassign {
            width: 100%; padding: 9px; border: none; border-radius: 8px;
            background: rgba(36,129,204,.1); color: var(--primary);
            font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s;
        }
        .btn-reassign:active { background: rgba(36,129,204,.2); }

        /* New order (awaiting manager approval) */
        .new-card {
            background: var(--bg); border-radius: var(--r);
            margin-bottom: 8px; padding: 11px 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,.05);
            border-left: 3px solid var(--danger);
        }
        .new-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .new-order-id { font-size: 12px; font-weight: 700; }
        .new-pill { background: rgba(229,57,53,.1); color: var(--danger); font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
        .new-route { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
        .new-route .arr { color: var(--hint); font-size: 10px; margin: 0 3px; }
        .new-meta { font-size: 10.5px; color: var(--hint); margin-bottom: 8px; }
        .btn-accept {
            width: 100%; padding: 9px; border: none; border-radius: 8px;
            background: rgba(43,202,128,.15); color: var(--success);
            font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s;
        }
        .btn-accept:active { background: rgba(43,202,128,.3); }

        /* Free order */
        .free-card {
            background: var(--bg); border-radius: var(--r);
            margin-bottom: 8px; padding: 11px 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,.05);
            border-left: 3px solid #ccc;
            display: flex; justify-content: space-between; align-items: center;
        }
        .free-route { font-size: 12px; font-weight: 600; }
        .free-route .arr { color: var(--hint); font-size: 10px; margin: 0 3px; }
        .free-meta { font-size: 10.5px; color: var(--hint); margin-top: 2px; }
        .free-price { font-size: 14px; font-weight: 800; color: var(--primary); white-space: nowrap; margin-left: 8px; }

        /* Courier card */
        .courier-card {
            background: var(--bg); border-radius: var(--r);
            margin-bottom: 8px; padding: 11px 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .courier-name  { font-size: 13px; font-weight: 600; }
        .courier-order { font-size: 11px; color: var(--hint); margin-top: 2px; }
        .badge-busy { background: #fff8e1; color: #e65100; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
        .badge-free { background: #e8f5e9; color: #2e7d32; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }

        /* Week nav */
        .week-nav {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg); border-radius: var(--r);
            padding: 10px 14px; margin-bottom: 10px;
            box-shadow: 0 1px 6px rgba(0,0,0,.05);
        }
        .week-btn {
            background: var(--sec-bg); border: none; border-radius: 8px;
            width: 34px; height: 34px; font-size: 17px; cursor: pointer; color: var(--text);
            display: flex; align-items: center; justify-content: center;
        }
        .week-btn:disabled { opacity: .3; cursor: default; }
        .week-lbl { font-size: 13px; font-weight: 600; }

        /* Report all button */
        .btn-report-all {
            width: 100%; padding: 13px; border: none; border-radius: var(--r);
            background: var(--success); color: #fff;
            font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 10px;
        }
        .btn-report-all:active { opacity: .85; }

        /* Section label */
        .section-lbl {
            font-size: 11px; font-weight: 700; color: var(--hint);
            text-transform: uppercase; letter-spacing: .5px;
            margin: 2px 2px 8px;
        }

        /* Report row */
        .report-row {
            background: var(--bg); border-radius: var(--r);
            margin-bottom: 8px; padding: 11px 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,.05);
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
        }
        .btn-report {
            background: rgba(36,129,204,.1); color: var(--primary);
            border: none; border-radius: 8px;
            padding: 7px 12px; font-size: 12px; font-weight: 700;
            cursor: pointer; white-space: nowrap; flex-shrink: 0;
        }
        .btn-report:active { background: rgba(36,129,204,.2); }

        /* Empty */
        .empty { text-align: center; padding: 40px 20px; color: var(--hint); }
        .empty-icon { font-size: 40px; margin-bottom: 8px; }
        .empty-text { font-size: 13px; }

        /* Error */
        .err-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center; padding:20px; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 100;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg); border-radius: 16px 16px 0 0;
            width: 100%; max-height: 75vh; overflow-y: auto;
            padding: 0 0 24px;
        }
        .modal-header {
            position: sticky; top: 0; background: var(--bg);
            padding: 16px 16px 10px;
            border-bottom: 1px solid var(--sec-bg);
        }
        .modal-title { font-size: 15px; font-weight: 700; }
        .modal-sub   { font-size: 12px; color: var(--hint); margin-top: 2px; }
        .modal-close {
            position: absolute; top: 12px; right: 14px;
            background: var(--sec-bg); border: none; border-radius: 50%;
            width: 28px; height: 28px; font-size: 15px; cursor: pointer; color: var(--hint);
        }
        .modal-courier {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 16px; border-bottom: 1px solid var(--sec-bg);
            cursor: pointer;
        }
        .modal-courier:active { background: var(--sec-bg); }
        .modal-courier-name { font-size: 13px; font-weight: 600; }
        .modal-courier-status { font-size: 11px; color: var(--hint); margin-top: 2px; }
        .modal-courier-arrow { color: var(--hint); font-size: 16px; }
    </style>
</head>
<body>
<div id="app"></div>

<!-- Модалка выбора курьера -->
<div class="modal-overlay" id="reassignModal" onclick="closeModal(event)">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Переназначить курьера</div>
            <div class="modal-sub" id="modalOrderId"></div>
            <button class="modal-close" onclick="closeReassignModal()">✕</button>
        </div>
        <div id="modalCourierList"></div>
    </div>
</div>

<script>
    const tg = (window.Telegram && window.Telegram.WebApp)
        ? window.Telegram.WebApp
        : { ready:()=>{}, expand:()=>{}, sendData:()=>{} };
    tg.ready(); tg.expand();

    let DATA = null;
    try {
        const raw = new URLSearchParams(window.location.search).get('d');
        if (raw) {
            const b64   = raw.replace(/-/g,'+').replace(/_/g,'/');
            const pad   = '='.repeat((4 - b64.length % 4) % 4);
            const bytes = Uint8Array.from(atob(b64+pad), c => c.charCodeAt(0));
            DATA = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        }
    } catch(e) { console.error(e); }

    const app = document.getElementById('app');

    let activeTab = 0;
    let weekOffset = 0; // 0 = текущая, -1 = прошлая и т.д.

    const STATUS_LABEL = {
        TAKEN: 'Взят', LOADING: 'Погрузка',
        IN_TRANSIT: 'В пути', ARRIVED: 'На месте',
    };

    const RU_MONTHS_GEN = [
        'января','февраля','марта','апреля','мая','июня',
        'июля','августа','сентября','октября','ноября','декабря'
    ];

    // ─── Неделя ───────────────────────────────────────────────────────────────
    function getWeekDates(offset) {
        const now = new Date();
        const dow = now.getDay();
        const mon = new Date(now);
        mon.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
        mon.setHours(0, 0, 0, 0);
        const sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        return { start: mon, end: sun };
    }

    function fmtDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function weekLabel(s, e) {
        if (s.getMonth() === e.getMonth())
            return `${s.getDate()}–${e.getDate()} ${RU_MONTHS_GEN[s.getMonth()]} ${s.getFullYear()}`;
        return `${s.getDate()} ${RU_MONTHS_GEN[s.getMonth()]} – ${e.getDate()} ${RU_MONTHS_GEN[e.getMonth()]} ${e.getFullYear()}`;
    }

    function changeWeek(delta) {
        const next = weekOffset + delta;
        if (next > 0) return;
        weekOffset = next;
        const { start, end } = getWeekDates(weekOffset);
        document.getElementById('weekLbl').textContent = weekLabel(start, end);
        const btnNext = document.getElementById('weekBtnNext');
        if (btnNext) btnNext.disabled = weekOffset >= 0;
    }

    // ─── Модалка переназначения ───────────────────────────────────────────────
    let _pendingOrder = null;

    function reassign(orderRow, orderId) {
        _pendingOrder = { row: orderRow, id: orderId };
        document.getElementById('modalOrderId').textContent = '№ ' + orderId;

        const couriers = DATA.couriers || [];
        const list = document.getElementById('modalCourierList');
        if (!couriers.length) {
            list.innerHTML = '<div class="empty"><div class="empty-icon">🚗</div><div class="empty-text">Нет активных курьеров</div></div>';
        } else {
            list.innerHTML = couriers.map(c => `
                <div class="modal-courier" onclick="confirmReassign('${c.tid}','${c.fio.replace(/'/g,"\\'")}')">
                    <div>
                        <div class="modal-courier-name">${c.fio}</div>
                        <div class="modal-courier-status">${c.busy ? '🔴 Сейчас занят' : '🟢 Свободен'}</div>
                    </div>
                    <span class="modal-courier-arrow">›</span>
                </div>`).join('');
        }
        document.getElementById('reassignModal').classList.add('open');
    }

    function closeReassignModal() {
        document.getElementById('reassignModal').classList.remove('open');
        _pendingOrder = null;
    }

    function closeModal(e) {
        if (e.target === document.getElementById('reassignModal')) closeReassignModal();
    }

    function confirmReassign(courierTid, courierName) {
        if (!_pendingOrder) return;
        tg.sendData(JSON.stringify({
            action: 'reassign_confirm',
            order_row: _pendingOrder.row,
            order_id: _pendingOrder.id,
            courier_tid: courierTid,
            courier_name: courierName,
        }));
    }

    function reportCourier(tid, name) {
        const { start } = getWeekDates(weekOffset);
        tg.sendData(JSON.stringify({
            action: 'manager_report',
            courier_tid: tid,
            courier_name: name,
            week_start: fmtDate(start)
        }));
    }

    function reportAll() {
        const { start } = getWeekDates(weekOffset);
        tg.sendData(JSON.stringify({
            action: 'manager_report_all',
            week_start: fmtDate(start)
        }));
    }

    // ─── Рендер карточек ──────────────────────────────────────────────────────
    function renderOrderCard(o) {
        return `
        <div class="order-card s-${o.status}">
            <div class="card-top">
                <span class="order-id">№ ${o.id}</span>
                <span class="status-pill sp-${o.status}">${STATUS_LABEL[o.status] || o.status}</span>
            </div>
            <div class="card-route">
                ${o.city_from}<span class="arr">→</span>${o.city_to}
            </div>
            <div class="card-meta">
                🚗 ${o.courier || '—'} &nbsp;·&nbsp; 💰 ${o.price} TJS &nbsp;·&nbsp; 📞 ${o.r_phone}
            </div>
            <button class="btn-reassign" onclick="reassign(${o.row},'${o.id}')">↔️ Переназначить</button>
        </div>`;
    }

    function renderNewCard(o) {
        return `
        <div class="new-card">
            <div class="new-card-top">
                <span class="new-order-id">№ ${o.id}</span>
                <span class="new-pill">⏳ Новый</span>
            </div>
            <div class="new-route">${o.city_from}<span class="arr">→</span>${o.city_to}</div>
            <div class="new-meta">👤 ${o.s_name || '—'} &nbsp;·&nbsp; 💰 ${o.price} TJS</div>
            <button class="btn-accept" onclick="acceptOrder(${o.row},'${o.id}')">✅ Принять в доставку</button>
        </div>`;
    }

    function acceptOrder(orderRow, orderId) {
        tg.sendData(JSON.stringify({ action: 'set_ready', order_id: orderId, order_row: orderRow }));
    }

    function renderFreeCard(o) {
        return `
        <div class="free-card">
            <div>
                <div class="free-route">${o.city_from}<span class="arr">→</span>${o.city_to}</div>
                <div class="free-meta">👤 ${o.s_name || '—'} &nbsp;·&nbsp; № ${o.id}</div>
            </div>
            <div class="free-price">${o.price} TJS</div>
        </div>`;
    }

    function renderCourierCard(c) {
        let orderInfo = '';
        if (c.busy) {
            const ord = DATA.orders.find(o => o.courier_id === c.tid);
            orderInfo = ord
                ? `${ord.city_from} → ${ord.city_to} · ${STATUS_LABEL[ord.status] || ord.status}`
                : 'В работе';
        }
        return `
        <div class="courier-card">
            <div style="min-width:0">
                <div class="courier-name">${c.fio}</div>
                ${c.busy ? `<div class="courier-order">${orderInfo}</div>` : ''}
            </div>
            <span class="${c.busy ? 'badge-busy' : 'badge-free'}">${c.busy ? 'Занят' : 'Свободен'}</span>
        </div>`;
    }

    function renderReportRow(c) {
        const safeName = c.fio.replace(/'/g, "\\'");
        return `
        <div class="report-row">
            <div style="min-width:0">
                <div class="courier-name">${c.fio}</div>
                <div class="courier-order">${c.busy ? 'Сейчас в работе' : 'Свободен'}</div>
            </div>
            <button class="btn-report" onclick="reportCourier('${c.tid}','${safeName}')">📄 Отчёт</button>
        </div>`;
    }

    // ─── Вкладки ──────────────────────────────────────────────────────────────
    function selectTab(i) {
        activeTab = i;
        document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', idx === i));
        document.querySelectorAll('.pane').forEach((p, idx) => p.classList.toggle('active', idx === i));
    }

    // ─── Главный рендер ───────────────────────────────────────────────────────
    function render() {
        const orders   = DATA.orders   || [];
        const free     = DATA.free     || [];
        const newOrds  = DATA.new      || [];
        const couriers = DATA.couriers || [];
        const busy     = couriers.filter(c => c.busy).length;

        const { start, end } = getWeekDates(weekOffset);
        const wLabel = weekLabel(start, end);

        const birzhaCount = newOrds.length + free.length;

        let birzhaHtml = '';
        if (!newOrds.length && !free.length) {
            birzhaHtml = '<div class="empty"><div class="empty-icon">🕳️</div><div class="empty-text">Нет заказов</div></div>';
        } else {
            if (newOrds.length) {
                birzhaHtml += `<div class="section-lbl">⏳ Ожидают подтверждения (${newOrds.length})</div>`;
                birzhaHtml += newOrds.map(renderNewCard).join('');
            }
            if (free.length) {
                birzhaHtml += `<div class="section-lbl" style="margin-top:${newOrds.length ? 12 : 2}px">📋 На бирже (${free.length})</div>`;
                birzhaHtml += free.map(renderFreeCard).join('');
            }
        }

        app.innerHTML = `
        <div class="header">
            <div class="header-sub">Mavsimi Rason</div>
            <div class="header-title">🎛 Панель управления</div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-val orange">${orders.length}</div>
                <div class="stat-lbl">В работе</div>
            </div>
            <div class="stat">
                <div class="stat-val" style="color:var(--danger)">${newOrds.length}</div>
                <div class="stat-lbl">Новых</div>
            </div>
            <div class="stat">
                <div class="stat-val green">${busy}/${couriers.length}</div>
                <div class="stat-lbl">Курьеров</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="selectTab(0)">🚚 В работе (${orders.length})</div>
            <div class="tab" onclick="selectTab(1)">📦 Заказы (${birzhaCount})</div>
            <div class="tab" onclick="selectTab(2)">👤 Курьеры (${couriers.length})</div>
            <div class="tab" onclick="selectTab(3)">📊 Отчёты</div>
        </div>

        <div class="pane active">
            ${orders.length
                ? orders.map(renderOrderCard).join('')
                : '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Нет активных заказов</div></div>'
            }
        </div>

        <div class="pane">
            ${birzhaHtml}
        </div>

        <div class="pane">
            ${couriers.length
                ? couriers.map(renderCourierCard).join('')
                : '<div class="empty"><div class="empty-icon">🚗</div><div class="empty-text">Нет активных курьеров</div></div>'
            }
        </div>

        <div class="pane">
            <div class="week-nav">
                <button class="week-btn" onclick="changeWeek(-1)">&#8592;</button>
                <span class="week-lbl" id="weekLbl">${wLabel}</span>
                <button class="week-btn" id="weekBtnNext" onclick="changeWeek(1)" ${weekOffset >= 0 ? 'disabled' : ''}>&#8594;</button>
            </div>

            <button class="btn-report-all" onclick="reportAll()">
                📊 Сводный отчёт на всех курьеров
            </button>

            <div class="section-lbl">Отчёт по курьеру</div>

            ${couriers.length
                ? couriers.map(renderReportRow).join('')
                : '<div class="empty"><div class="empty-icon">🚗</div><div class="empty-text">Нет активных курьеров</div></div>'
            }
        </div>`;
    }

    if (!DATA) {
        app.innerHTML = `<div class="err-screen"><div style="font-size:48px">🔗</div><div style="font-size:17px;font-weight:700;margin-top:12px">Нет данных</div><div style="font-size:13px;color:var(--hint);margin-top:6px">Откройте панель через бота</div></div>`;
    } else {
        render();
    }
</script>
</body>
</html>
