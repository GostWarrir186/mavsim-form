<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Статистика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="theme.css?v=2">
<script>
// Тема: явный выбор Telegram важнее системной; палитра — в theme.css
(function () {
    var d = document.documentElement, s = null;
    try { s = Telegram.WebApp.colorScheme; } catch (e) {}
    if (!s) s = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    d.setAttribute('data-theme', s);
    try { Telegram.WebApp.onEvent('themeChanged', function () {
        d.setAttribute('data-theme', Telegram.WebApp.colorScheme || 'light');
    }); } catch (e) {}
})();
</script>
<style>
    .head-wrap { padding-bottom: 10px; }
    .head-wrap .seg { margin-top: 11px; }

    /* ── график ── */
    .chart { display: flex; gap: 4px; height: 178px; }
    /* Каждый столбец — своя сетка из трёх строк: число / полоса / подпись.
       Так подпись физически не может наехать на число или на соседний столбец. */
    .chart .c-col {
        flex: 1 1 0; min-width: 0;
        display: grid; grid-template-rows: 14px 1fr 16px;
    }
    .chart .c-val {
        grid-row: 1; font-size: 10px; font-weight: 700; color: var(--ink-2);
        text-align: center; line-height: 14px; white-space: nowrap; overflow: hidden;
    }
    .chart .c-track { grid-row: 2; min-height: 0; display: flex; align-items: flex-end; }
    .chart .c-bar {
        width: 100%; min-height: 3px; border-radius: 5px 5px 3px 3px;
        background: var(--accent); opacity: .88;
        transition: height .45s cubic-bezier(.2,.7,.2,1), opacity .18s;
        cursor: pointer;
    }
    .chart .c-lbl {
        grid-row: 3; font-size: 10px; color: var(--ink-3);
        text-align: center; line-height: 16px; white-space: nowrap; overflow: hidden;
    }
    .chart .c-col.sel .c-bar { opacity: 1; }
    .chart .c-col.dim .c-bar { opacity: .3; }
    .readout {
        font-size: 13px; color: var(--ink-2); margin-bottom: 12px;
        min-height: 20px; display: flex; flex-wrap: wrap; gap: 4px 10px;
    }
    .readout b { color: var(--ink); font-weight: 650; }

    /* ── статусы: горизонтальная лента вместо кольца ── */
    .sbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
    .sbar i { display: block; height: 100%; }
    .slegend { display: flex; flex-direction: column; margin-top: 12px; }
    .sleg-row {
        display: flex; align-items: center; gap: 9px; padding: 8px 0;
        border-top: 1px solid var(--border); font-size: 13.5px; min-width: 0;
    }
    .sleg-row:first-child { border-top: none; }
    .sleg-row .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
    .sleg-row .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sleg-row .v { margin-left: auto; font-weight: 650; white-space: nowrap; }
    .sleg-row .p { color: var(--ink-3); font-size: 12.5px; width: 42px; text-align: right; flex: none; }

    /* minmax(0, 1fr), а не 1fr: иначе grid-элемент не может стать уже своего
       контента и карточка вылезает за экран (её обрезает overflow-x на body). */
    .two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    @media (min-width: 720px) { .two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .cour-rev { font-size: 13px; font-weight: 650; white-space: nowrap; flex: none; }
    .cour-bar { width: 56px; flex: none; }
    @media (max-width: 380px) { .cour-bar { display: none; } }
</style>
</head>

<header class="topbar">
    <div class="topbar-inner" style="display:block">
        <div class="row">
            <span class="glyph"><svg class="ic"><use href="#i-chart"></use></svg></span>
            <div class="spacer">
                <h1>Статистика</h1>
                <div class="sub" id="updated"></div>
            </div>
        </div>
        <div class="head-wrap">
            <div class="seg" id="seg" role="tablist" aria-label="Период">
                <button role="tab" data-p="week"  aria-pressed="true">Неделя</button>
                <button role="tab" data-p="month" aria-pressed="false">Месяц</button>
                <button role="tab" data-p="half"  aria-pressed="false">Полгода</button>
                <button role="tab" data-p="year"  aria-pressed="false">Год</button>
            </div>
        </div>
    </div>
</header>

<main class="container" style="padding-top:14px">
    <div class="stack" id="content"></div>
</main>

<script>
    try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}

    // ── декод ?d= ──
    var DATA = null;
    try {
        var raw = new URLSearchParams(location.search).get('d');
        if (raw) {
            var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
            var pad = '='.repeat((4 - b64.length % 4) % 4);
            var bytes = Uint8Array.from(atob(b64 + pad), function (c) { return c.charCodeAt(0); });
            DATA = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        }
    } catch (e) { console.error(e); }

    var STATUS_COLOR = {
        NEW: 'var(--s-new)', READY_FOR_DRIVERS: 'var(--s-ready)', TAKEN: 'var(--s-taken)',
        IN_TRANSIT: 'var(--s-transit)', DELIVERED: 'var(--s-delivered)', CANCELLED: 'var(--s-cancel)'
    };
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }
    function fmt(n) { return Number(n || 0).toLocaleString('ru-RU'); }
    function icon(name, cls) { return '<svg class="ic ' + (cls || '') + '"><use href="#i-' + name + '"></use></svg>'; }

    var content = document.getElementById('content');
    var updatedEl = document.getElementById('updated');
    var seg = document.getElementById('seg');
    var state = { period: 'week', chartMode: 'count' };

    if (!DATA || !DATA.periods) {
        content.innerHTML = '<div class="card"><div class="empty">' + icon('inbox') +
            '<div>Не удалось загрузить статистику.<br>Откройте панель заново кнопкой «Обновить».</div></div></div>';
    } else {
        updatedEl.textContent = 'обновлено ' + (DATA.generated_at || '—');
        render();
        seg.querySelectorAll('button').forEach(function (b) {
            b.addEventListener('click', function () {
                if (state.period === b.dataset.p) return;
                state.period = b.dataset.p;
                seg.querySelectorAll('button').forEach(function (x) {
                    x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
                });
                render();
            });
        });
    }

    function animateVal(el, target, decimals) {
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var out = function (v) { el.textContent = fmt(decimals ? Math.round(v * 10) / 10 : Math.round(v)); };
        if (reduce) { out(target); return; }
        var start = performance.now(), dur = 520;
        requestAnimationFrame(function step(t) {
            // rAF отдаёт время НАЧАЛА кадра — оно бывает раньше start, и тогда
            // k < 0 давал отрицательный множитель: на первом кадре мелькали
            // «-2 686 сом.» вместо нуля. Отсюда обязательный Math.max(0, …).
            var k = Math.max(0, Math.min(1, (t - start) / dur));
            out(target * (1 - Math.pow(1 - k, 3)));
            if (k < 1) requestAnimationFrame(step);
        });
    }

    function render() {
        var p = DATA.periods[state.period];
        var now = DATA.now || {};
        var ov = p.overview || {};

        var next = document.createElement('div');
        next.className = 'stack fade-in';

        // ── главный показатель ──
        var head = document.createElement('section');
        head.className = 'headline';
        head.innerHTML =
            '<div class="label">Выручка · ' + esc(p.label) + '</div>' +
            '<div class="value mono"><span id="revBig">0</span><span class="unit">сом.</span></div>' +
            '<div class="facts">' +
                '<div>Средний чек<b class="mono">' + fmt(ov.avg_check) + ' сом.</b></div>' +
                '<div>Доставлено<b class="mono">' + fmt(ov.delivered) + '</b></div>' +
                '<div>Всего заказов<b class="mono">' + fmt(ov.orders) + '</b></div>' +
            '</div>';
        next.appendChild(head);

        // ── показатели ──
        var stats = document.createElement('div');
        stats.className = 'stat-grid stat-grid-3 stat-grid-5';
        stats.innerHTML =
            stat('package', 'Заказов', ov.orders) +
            stat('check', 'Доставлено', ov.delivered) +
            stat('x-circle', 'Отменено', ov.cancelled) +
            stat('clock', 'В работе', now.in_progress, true) +
            stat('users', 'Курьеров', now.active_couriers, true);
        next.appendChild(stats);

        next.appendChild(chartCard(p));

        var two = document.createElement('div');
        two.className = 'two';
        two.appendChild(statusCard(p));
        two.appendChild(couriersCard(p));
        next.appendChild(two);

        // ── экспорт ──
        var exp = document.createElement('section');
        exp.className = 'card';
        exp.innerHTML =
            '<button class="btn btn-primary btn-block" id="exportBtn">' +
                icon('download') + 'Выгрузить для бухгалтерии</button>' +
            '<p class="hint center" style="font-size:12px;margin-top:9px">' +
                'Excel-реестр доставленных заказов · ' + esc(p.label) + '</p>';
        next.appendChild(exp);

        var foot = document.createElement('div');
        foot.className = 'foot';
        foot.textContent = 'Данные из базы-зеркала, обновляются каждые ~10 минут';
        next.appendChild(foot);

        content.replaceWith(next);
        content = next;

        animateVal(document.getElementById('revBig'), ov.revenue || 0);
        content.querySelectorAll('.stat-value span').forEach(function (el) {
            animateVal(el, parseFloat(el.dataset.v) || 0);
        });

        wireChart(p);
        document.getElementById('exportBtn').addEventListener('click', doExport);
    }

    function stat(ic, label, val, isNow) {
        return '<div class="stat">' +
            '<div class="stat-label">' + icon(ic, 'ic-sm') + '<span>' + label + '</span>' +
            (isNow ? '<span class="badge badge-accent" style="font-size:9.5px;padding:1px 6px">сейчас</span>' : '') +
            '</div>' +
            '<div class="stat-value mono"><span data-v="' + (val || 0) + '">0</span></div></div>';
    }

    function chartCard() {
        var card = document.createElement('section');
        card.className = 'card';
        card.innerHTML =
            '<div class="card-head">' +
                '<div class="card-title">Динамика</div>' +
                '<div class="seg" style="margin-left:auto;flex:none;width:auto" id="chartToggle">' +
                    '<button data-m="count" aria-pressed="true">Заказы</button>' +
                    '<button data-m="revenue" aria-pressed="false">Выручка</button>' +
                '</div>' +
            '</div>' +
            '<div class="readout" id="readout"></div>' +
            '<div class="chart" id="chart"></div>';
        return card;
    }

    function wireChart(p) {
        var series = p.series || [];
        var chart = document.getElementById('chart');
        var readout = document.getElementById('readout');
        var toggle = document.getElementById('chartToggle');
        var showNums = series.length <= 12;
        var labelEvery = series.length > 14 ? Math.ceil(series.length / 7) : 1;

        function summary(mode, vals) {
            var total = vals.reduce(function (a, b) { return a + b; }, 0);
            readout.innerHTML = mode === 'revenue'
                ? 'Выручка за период: <b class="mono">' + fmt(Math.round(total)) + ' сом.</b>'
                : 'Заказов за период: <b class="mono">' + fmt(total) + '</b>';
        }

        function draw(mode) {
            var vals = series.map(function (s) { return mode === 'revenue' ? s.revenue : s.count; });
            var max = Math.max.apply(null, vals.concat([1]));
            chart.innerHTML = series.map(function (s, i) {
                var v = vals[i];
                return '<div class="c-col" data-i="' + i + '">' +
                    '<span class="c-val">' + (showNums && v ? fmt(v) : '') + '</span>' +
                    '<span class="c-track"><span class="c-bar" data-h="' + (v / max * 100) + '"></span></span>' +
                    '<span class="c-lbl">' + (i % labelEvery === 0 ? esc(s.label) : '') + '</span>' +
                    '</div>';
            }).join('');
            requestAnimationFrame(function () {
                chart.querySelectorAll('.c-bar').forEach(function (b) { b.style.height = b.dataset.h + '%'; });
            });
            summary(mode, vals);
            chart.querySelectorAll('.c-col').forEach(function (col) {
                col.addEventListener('click', function () {
                    var i = +col.dataset.i, s = series[i];
                    var already = col.classList.contains('sel');
                    chart.querySelectorAll('.c-col').forEach(function (c) {
                        c.classList.toggle('sel', !already && c === col);
                        c.classList.toggle('dim', !already && c !== col);
                    });
                    if (already) { summary(mode, vals); return; }
                    readout.innerHTML = '<b>' + esc(s.label) + '</b>' +
                        '<span>заказов: <b class="mono">' + fmt(s.count) + '</b></span>' +
                        '<span>выручка: <b class="mono">' + fmt(s.revenue) + ' сом.</b></span>';
                });
            });
        }

        draw(state.chartMode);
        toggle.querySelectorAll('button').forEach(function (btn) {
            btn.addEventListener('click', function () {
                state.chartMode = btn.dataset.m;
                toggle.querySelectorAll('button').forEach(function (b) {
                    b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
                });
                draw(state.chartMode);
            });
        });
    }

    function statusCard(p) {
        var card = document.createElement('section');
        card.className = 'card';
        var head = '<div class="card-head"><div class="card-title">Статусы</div>' +
                   '<div class="card-note">' + esc(p.label) + '</div></div>';
        var statuses = (p.statuses || []).filter(function (s) { return s.count > 0; });
        if (!statuses.length) {
            card.innerHTML = head + '<div class="empty">' + icon('inbox') + '<div>Нет заказов за период</div></div>';
            return card;
        }
        var total = statuses.reduce(function (a, s) { return a + s.count; }, 0);
        card.innerHTML = head +
            '<div class="sbar">' + statuses.map(function (s) {
                return '<i style="width:' + (s.count / total * 100) + '%;background:' +
                       (STATUS_COLOR[s.status] || 'var(--s-new)') + '"></i>';
            }).join('') + '</div>' +
            '<div class="slegend">' + statuses.map(function (s) {
                return '<div class="sleg-row">' +
                    '<span class="sw" style="background:' + (STATUS_COLOR[s.status] || 'var(--s-new)') + '"></span>' +
                    '<span class="n">' + esc(s.label) + '</span>' +
                    '<span class="v mono">' + fmt(s.count) + '</span>' +
                    '<span class="p mono">' + s.pct + '%</span></div>';
            }).join('') + '</div>';
        return card;
    }

    function couriersCard(p) {
        var card = document.createElement('section');
        card.className = 'card';
        var couriers = p.couriers || [];
        var head = '<div class="card-head"><div class="card-title">Лучшие курьеры</div>' +
                   '<div class="card-note">' + esc(p.label) + '</div></div>';
        if (!couriers.length) {
            card.innerHTML = head + '<div class="empty">' + icon('users') + '<div>Нет доставленных заказов</div></div>';
            return card;
        }
        var maxD = Math.max.apply(null, couriers.map(function (c) { return c.deliveries; }).concat([1]));
        card.innerHTML = head + '<div class="list">' + couriers.map(function (c, i) {
            var parts = String(c.name).trim().split(/\s+/);
            var ini = ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
            return '<div class="list-row">' +
                '<span class="rank mono">' + (i + 1) + '</span>' +
                '<span class="avatar' + (i === 0 ? ' avatar-accent' : '') + '">' + esc(ini) + '</span>' +
                '<span class="body"><span class="name truncate" style="display:block">' + esc(c.name) + '</span>' +
                '<span class="meta mono">' + fmt(c.deliveries) + ' доставок</span></span>' +
                '<span class="progress cour-bar"><span style="width:' + (c.deliveries / maxD * 100) + '%"></span></span>' +
                '<span class="cour-rev mono">' + fmt(c.revenue) + '</span></div>';
        }).join('') + '</div>';
        return card;
    }

    function doExport() {
        var payload = JSON.stringify({ action: 'export_accounting', period: state.period });
        try {
            Telegram.WebApp.sendData(payload);  // закроет мини-приложение, файл придёт сообщением
        } catch (e) {
            alert('Экспорт доступен только внутри Telegram.');
        }
    }
</script>
</body>
</html>
