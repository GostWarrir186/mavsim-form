<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор недели отчёта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #2481cc;
            --primary-grad: linear-gradient(135deg, #2a8de0, #1a6db5);
            --bg: var(--tg-theme-bg-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --text: var(--tg-theme-text-color, #1c1c1e);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--sec-bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
        }

        .card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 32px 24px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.08);
        }

        .header {
            background: var(--primary-grad);
            margin: -32px -24px 28px;
            padding: 20px 24px;
            border-radius: var(--radius) var(--radius) 0 0;
            text-align: center;
        }
        .header-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .picker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 28px;
        }

        .arrow-btn {
            width: 52px;
            height: 52px;
            border: none;
            background: var(--sec-bg);
            border-radius: 14px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
            color: var(--text);
        }
        .arrow-btn:active { transform: scale(0.93); }
        .arrow-btn:disabled { opacity: 0.2; cursor: default; }

        .week-display {
            text-align: center;
            flex: 1;
            padding: 14px 8px;
            background: var(--sec-bg);
            border-radius: 14px;
        }
        .week-range {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .week-year {
            font-size: 12px;
            color: var(--hint);
            margin-top: 3px;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: var(--sec-bg);
            margin: 0 0 20px;
        }

        .info {
            font-size: 12px;
            color: var(--hint);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: var(--primary-grad);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            letter-spacing: 0.2px;
        }
        .btn-generate:active { opacity: 0.85; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="header-label">Mavsimi Rason</div>
        <div class="header-title">📄 Выбор недели отчёта</div>
    </div>

    <div class="picker">
        <button class="arrow-btn" id="prev">◀</button>
        <div class="week-display">
            <div class="week-range" id="weekRange"></div>
            <div class="week-year"  id="weekYear"></div>
        </div>
        <button class="arrow-btn" id="next">▶</button>
    </div>

    <div class="divider"></div>
    <div class="info" id="info"></div>

    <button class="btn-generate" id="generate">📄 Сформировать отчёт</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const RU_MONTHS_SHORT = [
        "янв","фев","мар","апр","мая","июн",
        "июл","авг","сен","окт","ноя","дек"
    ];
    const RU_MONTHS_GEN = [
        "января","февраля","марта","апреля","мая","июня",
        "июля","августа","сентября","октября","ноября","декабря"
    ];
    const MAX_WEEKS_BACK = 8;

    function getMondayOf(date) {
        const d = new Date(date);
        const day = d.getDay() === 0 ? 6 : d.getDay() - 1; // 0=Mon..6=Sun
        d.setDate(d.getDate() - day);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
    }

    function toISO(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
    }

    function weekLabel(monday) {
        const sunday = addDays(monday, 6);
        const sm = monday.getMonth();
        const em = sunday.getMonth();
        const sy = monday.getFullYear();
        const ey = sunday.getFullYear();

        const monStr = `${monday.getDate()} ${RU_MONTHS_SHORT[sm]}`;
        const sunStr = `${sunday.getDate()} ${RU_MONTHS_SHORT[em]}`;
        return `${monStr} — ${sunStr}`;
    }

    function yearLabel(monday) {
        const sunday = addDays(monday, 6);
        if (monday.getFullYear() === sunday.getFullYear()) {
            return `${monday.getFullYear()}`;
        }
        return `${monday.getFullYear()} / ${sunday.getFullYear()}`;
    }

    const now        = new Date();
    const curMonday  = getMondayOf(now);
    let   selMonday  = getMondayOf(now);

    function weekOffset() {
        return Math.round((curMonday - selMonday) / (7 * 86400000));
    }

    function update() {
        const sunday = addDays(selMonday, 6);
        document.getElementById("weekRange").textContent = weekLabel(selMonday);
        document.getElementById("weekYear").textContent  = yearLabel(selMonday);

        const off = weekOffset();
        document.getElementById("prev").disabled = off >= MAX_WEEKS_BACK;
        document.getElementById("next").disabled = off <= 0;

        const isCurrent = off === 0;
        let infoText;
        if (isCurrent) {
            infoText = "Текущая неделя — данные могут быть неполными";
        } else {
            const monDay  = selMonday.getDate();
            const sunDay  = sunday.getDate();
            const monMon  = RU_MONTHS_GEN[selMonday.getMonth()];
            const sunMon  = RU_MONTHS_GEN[sunday.getMonth()];
            const monYear = selMonday.getFullYear();
            const sunYear = sunday.getFullYear();

            if (selMonday.getMonth() === sunday.getMonth() && monYear === sunYear) {
                infoText = `Отчёт за ${monDay}–${sunDay} ${monMon} ${monYear}`;
            } else {
                infoText = `Отчёт за ${monDay} ${monMon} – ${sunDay} ${sunMon}`;
                if (monYear !== sunYear) infoText += ` ${sunYear}`;
            }
        }
        document.getElementById("info").textContent = infoText;
    }

    document.getElementById("prev").addEventListener("click", () => {
        selMonday = addDays(selMonday, -7);
        update();
    });

    document.getElementById("next").addEventListener("click", () => {
        selMonday = addDays(selMonday, 7);
        update();
    });

    document.getElementById("generate").addEventListener("click", () => {
        const data = JSON.stringify({ action: "generate_report", week_start: toISO(selMonday) });
        tg.sendData(data);
    });

    update();
</script>
</body>
</html>
