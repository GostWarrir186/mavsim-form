<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Выбор недели отчёта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="theme.css?v=2">
<script>
// Тема: явный выбор Telegram важнее системной; палитра — в theme.css
(function () {
    var d = document.documentElement, s = null;
    try { s = Telegram.WebApp.colorScheme; } catch (e) {}
    if (!s) s = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    d.setAttribute('data-theme', s);
    try { Telegram.WebApp.onEvent('themeChanged', function () {
        d.setAttribute('data-theme', Telegram.WebApp.colorScheme || 'light');
    }); } catch (e) {}
})();
</script>
<style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 14px; }
    .sheet { width: 100%; max-width: 420px; }
    .picker { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
    .picker .disp { flex: 1; text-align: center; min-width: 0; }
    .picker .range { font-size: 21px; font-weight: 700; letter-spacing: -.025em; }
    .picker .year { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
</style>
</head>

 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol><symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol><symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"/></symbol><symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></symbol><symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol><symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol><symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol><symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol></defs></svg>

<div class="sheet">
    <section class="card">
        <div class="card-head">
            <span class="glyph glyph-sm"><svg class="ic ic-sm"><use href="#i-download"></use></svg></span>
            <div>
                <div class="card-title">Отчёт за неделю</div>
                <div class="hint" style="font-size:12px">Mavsimi Rason</div>
            </div>
        </div>

        <div class="picker">
            <button class="icon-btn" id="prev" aria-label="Предыдущая неделя">
                <svg class="ic"><use href="#i-chevron-left"></use></svg>
            </button>
            <div class="disp">
                <div class="range mono" id="weekRange"></div>
                <div class="year mono" id="weekYear"></div>
            </div>
            <button class="icon-btn" id="next" aria-label="Следующая неделя">
                <svg class="ic"><use href="#i-chevron-right"></use></svg>
            </button>
        </div>

        <div class="note" id="info-box">
            <svg class="ic ic-sm"><use href="#i-info"></use></svg>
            <span id="info"></span>
        </div>

        <button class="btn btn-primary btn-block" id="generate" style="margin-top:14px">
            <svg class="ic"><use href="#i-download"></use></svg>Сформировать отчёт
        </button>
    </section>
</div>

<script>
    var tg = (window.Telegram && window.Telegram.WebApp)
        ? window.Telegram.WebApp
        : { ready: function () {}, expand: function () {}, sendData: function () {} };
    tg.ready(); tg.expand();

    var MONTHS_SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня',
                      'июля','августа','сентября','октября','ноября','декабря'];
    var MAX_WEEKS_BACK = 8;

    function getMonday(date) {
        var d = new Date(date), day = d.getDay() === 0 ? 6 : d.getDay() - 1;
        d.setDate(d.getDate() - day);
        d.setHours(0, 0, 0, 0);
        return d;
    }
    function addDays(date, n) { var d = new Date(date); d.setDate(d.getDate() + n); return d; }
    function toISO(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
               '-' + String(d.getDate()).padStart(2, '0');
    }

    var curMonday = getMonday(new Date());
    var selMonday = getMonday(new Date());

    function weekOffset() { return Math.round((curMonday - selMonday) / (7 * 86400000)); }

    function update() {
        var sunday = addDays(selMonday, 6);
        document.getElementById('weekRange').textContent =
            selMonday.getDate() + ' ' + MONTHS_SHORT[selMonday.getMonth()] +
            ' — ' + sunday.getDate() + ' ' + MONTHS_SHORT[sunday.getMonth()];
        document.getElementById('weekYear').textContent =
            selMonday.getFullYear() === sunday.getFullYear()
                ? String(selMonday.getFullYear())
                : selMonday.getFullYear() + ' / ' + sunday.getFullYear();

        var off = weekOffset();
        document.getElementById('prev').disabled = off >= MAX_WEEKS_BACK;
        document.getElementById('next').disabled = off <= 0;

        var box = document.getElementById('info-box');
        var text;
        if (off === 0) {
            text = 'Текущая неделя — данные могут быть неполными';
            box.classList.add('note-accent');
        } else {
            box.classList.remove('note-accent');
            var mY = selMonday.getFullYear(), sY = sunday.getFullYear();
            if (selMonday.getMonth() === sunday.getMonth() && mY === sY) {
                text = 'Отчёт за ' + selMonday.getDate() + '–' + sunday.getDate() + ' ' +
                       MONTHS_GEN[selMonday.getMonth()] + ' ' + mY;
            } else {
                text = 'Отчёт за ' + selMonday.getDate() + ' ' + MONTHS_GEN[selMonday.getMonth()] +
                       ' – ' + sunday.getDate() + ' ' + MONTHS_GEN[sunday.getMonth()];
                if (mY !== sY) text += ' ' + sY;
            }
        }
        document.getElementById('info').textContent = text;
    }

    document.getElementById('prev').addEventListener('click', function () {
        selMonday = addDays(selMonday, -7); update();
    });
    document.getElementById('next').addEventListener('click', function () {
        selMonday = addDays(selMonday, 7); update();
    });
    document.getElementById('generate').addEventListener('click', function () {
        tg.sendData(JSON.stringify({ action: 'generate_report', week_start: toISO(selMonday) }));
    });

    update();
</script>
</body>
</html>
