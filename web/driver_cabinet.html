<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кабинет курьера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="theme.css?v=2">
<script>
// Тема: явный выбор Telegram важнее системной; палитра — в theme.css
(function () {
    var d = document.documentElement, s = null;
    try { s = Telegram.WebApp.colorScheme; } catch (e) {}
    if (!s) s = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    d.setAttribute('data-theme', s);
    try { Telegram.WebApp.onEvent('themeChanged', function () {
        d.setAttribute('data-theme', Telegram.WebApp.colorScheme || 'light');
    }); } catch (e) {}
})();
</script>
<style>
    .lang { display: flex; gap: 4px; margin-left: auto; flex: none; }
    .lang button {
        font: inherit; font-size: 12px; font-weight: 650; padding: 5px 10px;
        border-radius: 999px; border: 1px solid var(--border); cursor: pointer;
        background: var(--surface); color: var(--ink-3); transition: all .16s;
    }
    .lang button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

    /* ── неделя ── */
    .week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .week-nav .lbl { flex: 1; text-align: center; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
    .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
    .day {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 8px 2px 7px; border-radius: var(--r-sm); cursor: pointer;
        border: 1px solid transparent; background: var(--surface-2);
        transition: background .16s, border-color .16s, color .16s;
    }
    .day .dn { font-size: 10px; font-weight: 650; color: var(--ink-3); }
    .day .dd { font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
    .day .dc {
        height: 15px; min-width: 15px; padding: 0 4px; border-radius: 999px;
        font-size: 9.5px; font-weight: 700; line-height: 15px;
        background: var(--accent-soft); color: var(--accent);
    }
    .day .dc.none { background: none; }
    .day.today { border-color: var(--border-strong); }
    .day.sel { background: var(--accent); border-color: var(--accent); }
    .day.sel .dn, .day.sel .dd { color: var(--on-accent); }
    .day.sel .dc { background: rgba(255,255,255,.24); color: var(--on-accent); }
    :root[data-theme="dark"] .day.sel .dc { background: rgba(0,0,0,.22); }

    /* ── доставки ── */
    .trip {
        display: flex; gap: 12px; padding: 12px 0;
        border-top: 1px solid var(--border); min-width: 0;
    }
    .trip:first-child { border-top: none; padding-top: 2px; }
    .trip .when { flex: none; width: 46px; text-align: center; }
    .trip .when .hm { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
    .trip .when .dm { font-size: 10.5px; color: var(--ink-3); }
    .trip .body { flex: 1; min-width: 0; }
    .trip .route { display: flex; align-items: center; gap: 6px; font-size: 14px; min-width: 0; }
    .trip .route .c { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trip .route .ic { color: var(--ink-3); flex: none; }
    .trip .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false"><defs><symbol id="i-package" viewBox="0 0 24 24"><path d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M2 5h20v4H2z"/><path d="M10 13h4"/></symbol><symbol id="i-truck" viewBox="0 0 24 24"><path d="M14 17V5a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h1"/><path d="M14 8h4l3 3v5a1 1 0 0 1-1 1h-1"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M9 17h6"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol><symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h6a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h3"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 12h.01"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15v-3"/><path d="M12 15V8"/><path d="M17 15v-6"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol><symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol><symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"/></symbol><symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></symbol><symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol><symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol><symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol><symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol></defs></svg>
<div id="app"></div>

<script>
    var tg = (window.Telegram && window.Telegram.WebApp)
        ? window.Telegram.WebApp
        : { ready: function () {}, expand: function () {}, close: function () {}, sendData: function () {} };
    tg.ready(); tg.expand();

    var DATA = null;
    try {
        var raw = new URLSearchParams(window.location.search).get('d');
        if (raw) {
            var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
            var pad = '='.repeat((4 - b64.length % 4) % 4);
            var bytes = Uint8Array.from(atob(b64 + pad), function (c) { return c.charCodeAt(0); });
            DATA = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        }
    } catch (e) { console.error('Ошибка парсинга данных:', e); }

    var app = document.getElementById('app');

    function esc(s) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(String(s == null ? '' : s)));
        return d.innerHTML;
    }
    function icon(n, cls) { return '<svg class="ic ' + (cls || '') + '"><use href="#i-' + n + '"></use></svg>'; }

    var T = {
        ru: {
            title: 'Кабинет курьера',
            stat_total: 'Доставок всего', stat_week: 'За эту неделю',
            report: 'Скачать отчёт за неделю',
            all: 'Все доставки', reset: 'Сбросить',
            empty_all: 'Доставок за месяц нет', empty_day: 'В этот день доставок нет',
            st_DELIVERED: 'Доставлен', st_IN_TRANSIT: 'В пути', st_TAKEN: 'Принят',
            pvz: 'ПВЗ', door: 'До двери',
            profile: 'Профиль', fio: 'ФИО',
            profile_hint: 'Смена ФИО требует подтверждения менеджера',
            save: 'Сохранить', lang_label: 'Язык интерфейса',
            no_data: 'Нет данных', no_data_sub: 'Откройте кабинет через бота Mavsimi Rason.',
            months: ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'],
            days: ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']
        },
        tj: {
            title: 'Кабинети курьер',
            stat_total: 'Ҳамаи фармоишҳо', stat_week: 'Дар ин ҳафта',
            report: 'Боргирии ҳисобот барои ҳафта',
            all: 'Ҳамаи фармоишҳо', reset: 'Бекор кардан',
            empty_all: 'Дар ин моҳ фармоише нест', empty_day: 'Дар ин рӯз фармоише нест',
            st_DELIVERED: 'Расонида шуд', st_IN_TRANSIT: 'Дар роҳ', st_TAKEN: 'Гирифта шуд',
            pvz: 'ПВЗ', door: 'То дар',
            profile: 'Профил', fio: 'Ному насаб',
            profile_hint: 'Тағйири ном тасдиқи менеҷерро талаб мекунад',
            save: 'Нигоҳ доштан', lang_label: 'Забони барнома',
            no_data: 'Маълумот нест', no_data_sub: 'Кабинетро тавассути боти Mavsimi Rason кушоед.',
            months: ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'],
            days: ['Дш','Сш','Чш','Пш','Ҷм','Ша','Яш']
        }
    };

    if (!DATA) {
        app.innerHTML = '<main class="container" style="padding-top:40px">' +
            '<div class="card"><div class="empty">' + icon('link') +
            '<div><b>' + T.ru.no_data + '</b><br>' + T.ru.no_data_sub + '</div></div></div></main>';
    } else {

    var deliveries = DATA.deliveries || [];
    var driverName = DATA.name || 'Курьер';
    var monthLabel = DATA.month_label || '';
    var savedLang = localStorage.getItem('driver_lang');
    var lang = (savedLang === 'ru' || savedLang === 'tj') ? savedLang
        : ((DATA.lang === 'ru' || DATA.lang === 'tj') ? DATA.lang : 'ru');
    var profileOpen = false;
    var fioDraft = driverName;

    var byDate = {};
    deliveries.forEach(function (d) { (byDate[d.d] = byDate[d.d] || []).push(d); });

    function iso(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
               '-' + String(d.getDate()).padStart(2, '0');
    }
    function parseIso(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
    function getMonday(date) {
        var d = new Date(date), day = d.getDay() === 0 ? 7 : d.getDay();
        d.setDate(d.getDate() - day + 1);
        d.setHours(0, 0, 0, 0);
        return d;
    }
    function addDays(date, n) { var d = new Date(date); d.setDate(d.getDate() + n); return d; }
    function sameDay(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    function t() { return T[lang]; }

    var today = new Date();
    var weekStart = getMonday(today);
    var selectedDate = iso(today);

    function weekLabel() {
        var end = addDays(weekStart, 6), m = t().months;
        return weekStart.getMonth() === end.getMonth()
            ? weekStart.getDate() + '–' + end.getDate() + ' ' + m[end.getMonth()]
            : weekStart.getDate() + ' ' + m[weekStart.getMonth()] + ' – ' + end.getDate() + ' ' + m[end.getMonth()];
    }

    function stats() {
        var done = deliveries.filter(function (d) { return d.s === 'DELIVERED'; });
        var ws = iso(weekStart), we = iso(addDays(weekStart, 6));
        return {
            total: done.length,
            week: done.filter(function (d) { return d.d >= ws && d.d <= we; }).length
        };
    }

    var TONE = { DELIVERED: 'badge badge-ok', IN_TRANSIT: 'badge badge-violet', TAKEN: 'badge badge-info' };

    function daysGrid() {
        var out = '';
        for (var i = 0; i < 7; i++) {
            var d = addDays(weekStart, i), key = iso(d);
            var n = byDate[key] ? byDate[key].length : 0;
            var cls = 'day';
            if (key === selectedDate) cls += ' sel';
            else if (sameDay(d, today)) cls += ' today';
            out += '<div class="' + cls + '" data-iso="' + key + '">' +
                '<span class="dn">' + t().days[i] + '</span>' +
                '<span class="dd mono">' + d.getDate() + '</span>' +
                '<span class="dc mono' + (n ? '' : ' none') + '">' + (n || '') + '</span></div>';
        }
        return '<div class="days">' + out + '</div>';
    }

    function tripRow(d) {
        return '<div class="trip">' +
            '<div class="when"><div class="hm mono">' + esc(d.t) + '</div>' +
            '<div class="dm mono">' + esc(String(d.d).slice(8) + '.' + String(d.d).slice(5, 7)) + '</div></div>' +
            '<div class="body">' +
                '<div class="route"><span class="c">' + esc(d.f) + '</span>' +
                icon('arrow-right', 'ic-sm') + '<span class="c">' + esc(d.to) + '</span></div>' +
                '<div class="tags">' +
                    '<span class="' + (TONE[d.s] || 'badge') + '"><i class="dot"></i>' +
                        esc(t()['st_' + d.s] || d.s) + '</span>' +
                    '<span class="badge">' + esc(d.tp === 'PVZ' ? t().pvz : t().door) + '</span>' +
                    '<span class="badge mono">' + esc(d.i) + '</span>' +
                '</div>' +
            '</div></div>';
    }

    function render() {
        var s = stats();
        var list = selectedDate ? (byDate[selectedDate] || []).slice() : deliveries.slice();
        list.sort(function (a, b) { return String(b.t).localeCompare(String(a.t)); });

        var selLabel = selectedDate
            ? parseIso(selectedDate).getDate() + ' ' + t().months[parseIso(selectedDate).getMonth()]
            : t().all;

        var listHtml = list.length
            ? list.map(tripRow).join('')
            : '<div class="empty">' + icon('inbox') + '<div>' +
              esc(selectedDate ? t().empty_day : t().empty_all) + '</div></div>';

        var initials = String(driverName).trim().split(/\s+/).slice(0, 2)
            .map(function (w) { return w[0] || ''; }).join('').toUpperCase();

        app.innerHTML =
        '<header class="topbar"><div class="topbar-inner">' +
            '<span class="glyph"><svg class="ic"><use href="#i-truck"></use></svg></span>' +
            '<div class="spacer"><h1>' + esc(t().title) + '</h1>' +
            '<div class="sub">' + esc(monthLabel) + '</div></div>' +
            '<div class="lang">' +
                '<button data-lang="ru" aria-pressed="' + (lang === 'ru') + '">RU</button>' +
                '<button data-lang="tj" aria-pressed="' + (lang === 'tj') + '">TJ</button>' +
            '</div>' +
        '</div></header>' +

        '<main class="container" style="padding-top:14px"><div class="stack">' +

            '<section class="card">' +
                '<div class="row">' +
                    '<span class="avatar avatar-accent">' + esc(initials || '?') + '</span>' +
                    '<div class="spacer"><div style="font-weight:650" class="truncate">' + esc(driverName) + '</div>' +
                    '<div class="hint" style="font-size:12.5px">' + esc(t().profile) + '</div></div>' +
                    '<button class="icon-btn" id="btnProfile" aria-expanded="' + profileOpen + '">' +
                        icon(profileOpen ? 'chevron-up' : 'edit') + '</button>' +
                '</div>' +
                (profileOpen ?
                '<div style="margin-top:14px">' +
                    '<div class="field"><label class="label" for="fio">' + esc(t().fio) + '</label>' +
                    '<input class="input" id="fio" type="text" value="' + esc(fioDraft) + '"></div>' +
                    '<div class="field"><span class="label">' + esc(t().lang_label) + '</span>' +
                        '<div class="choice">' +
                        '<button type="button" data-plang="ru" aria-pressed="' + (lang === 'ru') + '"><span class="t">Русский</span></button>' +
                        '<button type="button" data-plang="tj" aria-pressed="' + (lang === 'tj') + '"><span class="t">Тоҷикӣ</span></button>' +
                        '</div></div>' +
                    '<div class="note" style="margin-top:13px">' + icon('info', 'ic-sm') +
                        '<span>' + esc(t().profile_hint) + '</span></div>' +
                    '<button class="btn btn-primary btn-block" id="btnSave" style="margin-top:13px">' +
                        icon('check') + esc(t().save) + '</button>' +
                '</div>' : '') +
            '</section>' +

            '<div class="stat-grid">' +
                '<div class="stat"><div class="stat-label">' + icon('check', 'ic-sm') +
                    '<span>' + esc(t().stat_total) + '</span></div>' +
                    '<div class="stat-value mono">' + s.total + '</div></div>' +
                '<div class="stat"><div class="stat-label">' + icon('calendar', 'ic-sm') +
                    '<span>' + esc(t().stat_week) + '</span></div>' +
                    '<div class="stat-value mono">' + s.week + '</div></div>' +
            '</div>' +

            '<section class="card">' +
                '<div class="week-nav">' +
                    '<button class="icon-btn" id="prevWeek">' + icon('chevron-left') + '</button>' +
                    '<span class="lbl">' + esc(weekLabel()) + '</span>' +
                    '<button class="icon-btn" id="nextWeek">' + icon('chevron-right') + '</button>' +
                '</div>' +
                daysGrid() +
                '<button class="btn btn-accent-outline btn-block" id="btnReport" style="margin-top:14px">' +
                    icon('download') + esc(t().report) + '</button>' +
            '</section>' +

            '<section class="card">' +
                '<div class="card-head">' +
                    '<div class="card-title">' + esc(selLabel) + '</div>' +
                    (selectedDate ? '<button class="btn btn-ghost btn-sm" id="clearDay" style="margin-left:auto">' +
                        esc(t().reset) + '</button>' : '') +
                '</div>' + listHtml +
            '</section>' +

        '</div></main>';

        wire();
    }

    function wire() {
        app.querySelectorAll('[data-lang]').forEach(function (b) {
            b.addEventListener('click', function () {
                lang = b.dataset.lang;
                localStorage.setItem('driver_lang', lang);
                render();
            });
        });
        app.querySelectorAll('[data-plang]').forEach(function (b) {
            b.addEventListener('click', function () {
                var input = document.getElementById('fio');
                if (input) fioDraft = input.value;
                lang = b.dataset.plang;
                localStorage.setItem('driver_lang', lang);
                render();
            });
        });
        app.querySelectorAll('.day').forEach(function (el) {
            el.addEventListener('click', function () {
                selectedDate = (selectedDate === el.dataset.iso) ? null : el.dataset.iso;
                render();
            });
        });

        var on = function (id, fn) {
            var el = document.getElementById(id);
            if (el) el.addEventListener('click', fn);
        };

        on('btnProfile', function () {
            var input = document.getElementById('fio');
            if (input) fioDraft = input.value;
            profileOpen = !profileOpen;
            render();
        });
        on('btnSave', function () {
            var fio = (document.getElementById('fio').value || '').trim();
            if (!fio) return;
            tg.sendData(JSON.stringify({ action: 'update_profile', fio: fio, lang: lang }));
            tg.close();
        });
        on('btnReport', function () {
            tg.sendData(JSON.stringify({ action: 'generate_report', week_start: iso(weekStart) }));
        });
        on('prevWeek', function () { weekStart = addDays(weekStart, -7); render(); });
        on('nextWeek', function () { weekStart = addDays(weekStart, 7); render(); });
        on('clearDay', function () { selectedDate = null; render(); });
    }

    render();
    }
</script>
</body>
</html>
