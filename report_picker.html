<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор периода отчёта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #2481cc;
            --primary-grad: linear-gradient(135deg, #2a8de0, #1a6db5);
            --bg: var(--tg-theme-bg-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --text: var(--tg-theme-text-color, #1c1c1e);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--sec-bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
        }

        .card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 32px 24px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.08);
        }

        .header {
            background: var(--primary-grad);
            margin: -32px -24px 28px;
            padding: 20px 24px;
            border-radius: var(--radius) var(--radius) 0 0;
            text-align: center;
        }
        .header-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .picker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 28px;
        }

        .arrow-btn {
            width: 52px;
            height: 52px;
            border: none;
            background: var(--sec-bg);
            border-radius: 14px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
            color: var(--text);
        }
        .arrow-btn:active { transform: scale(0.93); }
        .arrow-btn:disabled { opacity: 0.2; cursor: default; }

        .month-display {
            text-align: center;
            flex: 1;
            padding: 14px 0;
            background: var(--sec-bg);
            border-radius: 14px;
        }
        .month-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .year-name {
            font-size: 13px;
            color: var(--hint);
            margin-top: 3px;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: var(--sec-bg);
            margin: 0 0 20px;
        }

        .info {
            font-size: 12px;
            color: var(--hint);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: var(--primary-grad);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            letter-spacing: 0.2px;
        }
        .btn-generate:active { opacity: 0.85; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="header-label">Mavsimi Rason</div>
        <div class="header-title">📄 Выбор периода отчёта</div>
    </div>

    <div class="picker">
        <button class="arrow-btn" id="prev">◀</button>
        <div class="month-display">
            <div class="month-name" id="monthName"></div>
            <div class="year-name" id="yearName"></div>
        </div>
        <button class="arrow-btn" id="next">▶</button>
    </div>

    <div class="divider"></div>
    <div class="info" id="info"></div>

    <button class="btn-generate" id="generate">📄 Сформировать отчёт</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const RU_MONTHS = [
        "Январь","Февраль","Март","Апрель","Май","Июнь",
        "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
    ];
    const RU_MONTHS_GEN = [
        "января","февраля","марта","апреля","мая","июня",
        "июля","августа","сентября","октября","ноября","декабря"
    ];

    const now = new Date();
    let selMonth = now.getMonth();
    let selYear  = now.getFullYear();

    const maxTotal = selYear * 12 + selMonth;
    const minTotal = maxTotal - 11; // до 12 месяцев назад

    function total(m, y) { return y * 12 + m; }

    function update() {
        document.getElementById("monthName").textContent = RU_MONTHS[selMonth];
        document.getElementById("yearName").textContent  = selYear;

        const t = total(selMonth, selYear);
        document.getElementById("prev").disabled = t <= minTotal;
        document.getElementById("next").disabled = t >= maxTotal;

        const isCurrentMonth = t === maxTotal;
        document.getElementById("info").textContent = isCurrentMonth
            ? "Текущий месяц — данные могут быть неполными"
            : `Отчёт за ${RU_MONTHS_GEN[selMonth]} ${selYear}`;
    }

    document.getElementById("prev").addEventListener("click", () => {
        if (selMonth === 0) { selMonth = 11; selYear--; }
        else { selMonth--; }
        update();
    });

    document.getElementById("next").addEventListener("click", () => {
        if (selMonth === 11) { selMonth = 0; selYear++; }
        else { selMonth++; }
        update();
    });

    document.getElementById("generate").addEventListener("click", () => {
        const mm   = String(selMonth + 1).padStart(2, "0");
        const data = JSON.stringify({ action: "generate_report", month: `${mm}.${selYear}` });
        tg.sendData(data);
    });

    update();
</script>
</body>
</html>
